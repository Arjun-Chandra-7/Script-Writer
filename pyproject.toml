[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "viralyst-script-writer"
version = "0.2.0"
description = "Evidence-grounded script intelligence and retrieval for VIRALYST"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[project.scripts]
script-writer = "script_writer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
